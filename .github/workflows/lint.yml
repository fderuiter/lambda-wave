name: Lint

on:
  push:
    branches:
      - 'feature/*'
      - 'bugfix/*'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Haskell
        uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553 # v2
        with:
          ghc-version: '9.4'
          cabal-version: 'latest'

      - name: Install HLint
        run: cabal install hlint

      - name: Run HLint
        run: hlint src/ tools/

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Run clang-format
        run: find cbits -name "*.c" -o -name "*.h" | xargs clang-format -n -Werror

      - name: Check Reference Docs Narrative
        run: ./scripts/check_reference_narrative.py
