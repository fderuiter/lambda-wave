name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: haskell:9.6.7-slim-bullseye
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y build-essential liblapack-dev libblas-dev


      - name: Build dependencies
        run: cabal build --only-dependencies

      - name: Build Binary
        run: cabal build

      - name: Run Tests
        run: cabal test | tee test.log

      - name: Run Benchmarks
        run: cabal bench | tee bench.log || true

      - name: Compliance Gate
        run: python3 scripts/regulatory_sync.py test.log bench.log

      - name: Archive Compliance Report
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: regulatory-evidence-report
          path: regulatory_evidence_report.md

      - name: Prepare Artifact
        run: |
          mkdir release
          cp $(cabal list-bin sgrt-radar-system-exe) release/sgrt-radar-system
          cd release
          sha256sum sgrt-radar-system > sgrt-radar-system.sha256

      - name: Create Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: |
            release/sgrt-radar-system
            release/sgrt-radar-system.sha256
            regulatory_evidence_report.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
