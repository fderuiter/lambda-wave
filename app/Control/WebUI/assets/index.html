<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lambda-Wave SGRT Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; height: 90vh; }
        .card { background-color: #2d2d2d; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 10px; }

        #canvas-container { height: 100%; display: flex; justify-content: center; align-items: center; background: #000; position: relative; }
        canvas { width: 100%; height: 100%; }

        .status-indicator { padding: 20px; text-align: center; border-radius: 4px; font-size: 2em; font-weight: bold; margin-bottom: 20px; }
        .beam-on { background-color: #28a745; color: white; }
        .beam-off { background-color: #dc3545; color: white; }
        .beam-hold { background-color: #ffc107; color: black; }

        .metric { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .metric-value { font-family: monospace; font-size: 1.2em; color: #66d9ef; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main Visualization (Point Cloud) -->
        <div class="card" id="canvas-container">
            <canvas id="radarCanvas"></canvas>
            <div style="position: absolute; top: 10px; left: 10px; color: #666;">Top Down View (X-Z Plane)</div>
        </div>

        <!-- Sidebar (Stats & Controls) -->
        <div class="card">
            <h2>System Status</h2>
            <div id="beam-status" class="status-indicator beam-off">BEAM OFF</div>

            <div class="metric">
                <span>Target Pos (mm):</span>
                <span id="target-pos" class="metric-value">0.0, 0.0, 0.0</span>
            </div>
            <div class="metric">
                <span>Velocity (mm/s):</span>
                <span id="target-vel" class="metric-value">0.0</span>
            </div>
            <div class="metric">
                <span>Frame Time (ns):</span>
                <span id="frame-time" class="metric-value">0</span>
            </div>
            <div class="metric">
                <span>Points Tracked:</span>
                <span id="points-count" class="metric-value">0</span>
            </div>

            <div style="margin-top: 50px; text-align: center; color: #888;">
                <p>WebSocket Status: <span id="ws-status" style="color: red;">Disconnected</span></p>
                <p><small>Lambda-Wave v0.1.0 (Class C)</small></p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const wsStatus = document.getElementById('ws-status');
        const beamStatus = document.getElementById('beam-status');

        let width, height;

        function resize() {
            width = canvas.parentElement.clientWidth;
            height = canvas.parentElement.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Connect WebSocket
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;
        let socket;

        function connect() {
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                wsStatus.textContent = 'Connected';
                wsStatus.style.color = '#28a745';
            };

            socket.onclose = () => {
                wsStatus.textContent = 'Disconnected (Retrying...)';
                wsStatus.style.color = '#dc3545';
                setTimeout(connect, 3000);
            };

            socket.onmessage = (event) => {
                try {
                    const state = JSON.parse(event.data);
                    updateUI(state);
                    draw(state);
                } catch (e) {
                    console.error("Parse Error", e);
                }
            };
        }

        function updateUI(state) {
            // Beam State
            beamStatus.className = 'status-indicator';
            if (state.beamState === 'BeamOn') {
                beamStatus.classList.add('beam-on');
                beamStatus.textContent = 'BEAM ON';
            } else if (state.beamState === 'BeamHold') {
                beamStatus.classList.add('beam-hold');
                beamStatus.textContent = 'BEAM HOLD';
            } else {
                beamStatus.classList.add('beam-off');
                beamStatus.textContent = 'BEAM OFF';
            }

            // Metrics
            if (state.kalmanState && state.kalmanState.x) {
                const [x, y, z] = state.kalmanState.x;
                document.getElementById('target-pos').textContent = `${x.toFixed(1)}, ${y.toFixed(1)}, ${z.toFixed(1)}`;
                // Assuming Velocity is in state, but simpler to derive or just show pos for now.
            }

            document.getElementById('frame-time').textContent = state.lastFrameTime;
            document.getElementById('points-count').textContent = state.currentPoints ? state.currentPoints.length : 0;
        }

        function draw(state) {
            // Clear
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            // Draw Grid (Isocenter)
            const cx = width / 2;
            const cy = height / 2;
            const scale = 50; // pixels per unit (assuming meter? or decimeter?) Let's adjust based on range.
            // If range is +/- 1 meter, we want 1m to be half width.
            // scale = (width / 2) / 1000 (if mm) -> too small.
            // Let's assume input is mm. 500mm = 50cm.
            // Scale: 0.5 pixel per mm.
            const mmScale = 0.5;

            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;

            // Axes
            ctx.beginPath();
            ctx.moveTo(cx, 0); ctx.lineTo(cx, height);
            ctx.moveTo(0, cy); ctx.lineTo(width, cy);
            ctx.stroke();

            // Concentric Circles (every 100mm)
            for (let r = 100; r <= 1000; r += 100) {
                ctx.beginPath();
                ctx.arc(cx, cy, r * mmScale, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Draw Points
            if (state.currentPoints) {
                ctx.fillStyle = '#00ffff';
                state.currentPoints.forEach(p => {
                    // Top Down: X is X, Z is Y (Depth)
                    const x = cx + (p.x * mmScale);
                    const y = cy - (p.z * mmScale); // Invert Y for canvas

                    ctx.beginPath();
                    ctx.arc(x, y, 2, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // Draw Kalman Target
            if (state.kalmanState && state.kalmanState.x) {
                const [kx, ky, kz] = state.kalmanState.x;
                const tx = cx + (kx * mmScale);
                const ty = cy - (kz * mmScale);

                ctx.strokeStyle = 'red';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(tx - 10, ty); ctx.lineTo(tx + 10, ty);
                ctx.moveTo(tx, ty - 10); ctx.lineTo(tx, ty + 10);
                ctx.stroke();

                // Prediction circle
                ctx.beginPath();
                ctx.arc(tx, ty, 5, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        connect();
    </script>
</body>
</html>
