repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]
        exclude: ^cbits/imgui/
  - repo: local
    hooks:
      - id: check-forbidden-files
        name: check for forbidden files
        entry: ./scripts/check-forbidden-files.sh
        language: script
        pass_filenames: false
      - id: ormolu
        name: ormolu
        entry: bash -c 'command -v ormolu >/dev/null 2>&1 || { echo "ormolu not found"; exit 1; }; ormolu --mode inplace "$@"' --
        language: system
        types: [haskell]
      - id: hlint
        name: hlint
        entry: bash -c 'command -v hlint >/dev/null 2>&1 || { echo "hlint not found"; exit 1; }; hlint "$@"' --
        language: system
        types: [haskell]
        files: ^(src|tools)/
