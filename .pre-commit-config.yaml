repos:
  - repo: local
    hooks:
      - id: ormolu
        name: ormolu
        entry: bash -c 'command -v ormolu >/dev/null 2>&1 || { echo "ormolu not found"; exit 1; }; ormolu --mode check "$@"' --
        language: system
        types: [haskell]
      - id: hlint
        name: hlint
        entry: bash -c 'command -v hlint >/dev/null 2>&1 || { echo "hlint not found"; exit 1; }; hlint "$@"' --
        language: system
        types: [haskell]
      - id: clang-format
        name: clang-format
        entry: bash -c 'command -v clang-format >/dev/null 2>&1 || { echo "clang-format not found"; exit 1; }; clang-format --dry-run --Werror "$@"' --
        language: system
        types_or: [c, c++]
      - id: cabal-build
        name: cabal build all
        entry: bash -c 'command -v cabal >/dev/null 2>&1 || { echo "cabal not found"; exit 1; }; cabal build all'
        language: system
        pass_filenames: false
        types_or: [haskell, c, c++]
      - id: cabal-test
        name: cabal test local suites
        entry: bash -c 'command -v cabal >/dev/null 2>&1 || { echo "cabal not found"; exit 1; }; TESTS=$(grep "^test-suite" sgrt-radar-system.cabal | awk "{print \$2}" | grep -v "clinical-hil-validation"); for t in $TESTS; do cabal test "$t" || exit 1; done'
        language: system
        pass_filenames: false
        types_or: [haskell, c, c++]
