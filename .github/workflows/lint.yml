name: Lint

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - 'feature/*'
      - 'bugfix/*'

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Haskell
        uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553 # v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HLint
        run: cabal install hlint --ignore-project

      - name: Run HLint
        run: hlint src/ tools/

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Run clang-format
        run: find cbits -path "cbits/imgui" -prune -o -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" \) -print | xargs clang-format -n -Werror

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Check Reference Docs Narrative
        run: ./scripts/check_reference_narrative.py

      - name: Check Architecture Docs Sync
        run: python3 ./scripts/extract_architecture.py --check
      - name: Generate Traceability Matrix
        run: python3 tools/qa/compliance_engine.py
      - name: Verify Traceability Links
        run: python3 scripts/verify_traceability_links.py
