name: Build and Test

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Haskell
        uses: haskell/actions/setup@v2
        with:
          ghc-version: '9.4'
          cabal-version: 'latest'

      - name: Update Cabal
        run: cabal update

      - name: Build dependencies
        run: cabal build --only-dependencies

      - name: Build
        run: cabal build

      - name: Run SafeCheck (FFI Audit)
        run: |
          ghc -isrc -Icbits/include cbits/src/ring_buffer.cpp test/SafeCheck.hs -o safe-check -lstdc++
          ./safe-check
