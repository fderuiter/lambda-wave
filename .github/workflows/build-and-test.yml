name: Build and Test

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get modified files and evaluate path selector
        id: path_selector
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch origin ${{ github.base_ref }} || true
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > modified_files.txt
            if [ $? -ne 0 ]; then
              echo "git diff failed, falling back to git show"
              git show --name-only --format= > modified_files.txt
            fi
          else
            git show --name-only --format= > modified_files.txt
          fi
          echo "Modified files detected:"
          cat modified_files.txt
          python scripts/path_selector.py modified_files.txt

      - name: Validate Documentation Metadata
        if: steps.path_selector.outputs.prototype_only != 'true'
        run: python3 scripts/sync_metadata.py --check

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Install system dependencies
        run: scripts/setup_env.sh

      - name: Update package index
        run: cabal update

      - name: Build dependencies
        run: cabal build --only-dependencies

      - name: Run Code Optimization
        if: steps.path_selector.outputs.prototype_only != 'true'
        run: |
          cabal build bolt-optimizer
          find src/ src-math/ -type f -name "*.hs" | xargs cabal run bolt-optimizer --

      - name: Build
        run: cabal build

      - name: Build Watchdog Fault Executable
        run: cabal build watchdog-fault

      - name: Run Tests
        run: cabal test | tee test.log

      - name: Run Benchmarks
        run: cabal bench | tee bench.log || true

      - name: Compliance Gate
        if: steps.path_selector.outputs.prototype_only != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/regulatory_sync.py test.log bench.log

      - name: Archive Compliance Report
        if: always() && steps.path_selector.outputs.prototype_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-evidence-report
          path: regulatory_evidence_report.md

      - name: Archive Safety Audit Artifact
        if: always() && steps.path_selector.outputs.prototype_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: safety-audit-report
          path: "**/safety_audit_report.txt"
