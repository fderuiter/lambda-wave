name: Build and Test

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Documentation Metadata
        run: python3 scripts/sync_metadata.py --check

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Install system dependencies
        run: scripts/setup_env.sh

      - name: Update package index
        run: cabal update

      - name: Build dependencies
        run: cabal build --only-dependencies

      - name: Run Code Optimization
        run: |
          cabal build bolt-optimizer
          find src/ -type f -name "*.hs" | xargs cabal run bolt-optimizer --

      - name: Build
        run: cabal build

      - name: Build Watchdog Fault Executable
        run: cabal build watchdog-fault

      - name: Run Tests
        run: cabal test | tee test.log

      - name: Run Benchmarks
        run: cabal bench | tee bench.log || true

      - name: Compliance Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/regulatory_sync.py test.log bench.log

      - name: Archive Compliance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-evidence-report
          path: regulatory_evidence_report.md

      - name: Archive Safety Audit Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-audit-report
          path: "**/safety_audit_report.txt"
