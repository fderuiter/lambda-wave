name: Build and Test

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: haskell:9.6.7
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: scripts/setup_env.sh

      - name: Update Cabal
        run: cabal update

      - name: Build dependencies
        run: cabal build --only-dependencies

      - name: Build
        run: cabal build

      - name: Build Watchdog Fault Executable
        run: cabal build watchdog-fault

      - name: Run Tests
        run: cabal test | tee test.log

      - name: Run Benchmarks
        run: cabal bench | tee bench.log || true

      - name: Compliance Gate
        run: python3 scripts/regulatory_sync.py test.log bench.log

      - name: Archive Compliance Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: regulatory-evidence-report
          path: regulatory_evidence_report.md

      - name: Archive Safety Audit Artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: safety-audit-report
          path: safety_audit_report.txt
