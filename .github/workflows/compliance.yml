name: IEC 62304 Compliance Pipeline

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  compliance-checks:
    runs-on: ubuntu-latest
    container:
      image: haskell:9.8
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: scripts/setup_env.sh

      - name: Update Cabal
        run: cabal update

      - name: Build dependencies with coverage
        run: cabal build --enable-coverage --only-dependencies

      - name: Build with coverage
        run: cabal build --enable-coverage

      - name: Build fault injection tools
        run: cabal build watchdog-fault --enable-coverage

      - name: Run Safety-Critical Tests and Generate Coverage
        run: cabal test sgrt-radar-system-test watchdog-check --enable-coverage

      - name: Calculate and Enforce Coverage
        run: |
          echo "Finding .tix files..."
          find . -name "*.tix"
          
          # Create a combined tix file
          # We will pass all found .tix files to hpc sum
          TIX_FILES=$(find . -name "*.tix" | grep -v "combined.tix")
          if [ -z "$TIX_FILES" ]; then
            echo "No coverage files found!"
            exit 1
          fi
          
          hpc sum $TIX_FILES --output=combined.tix
          
          # We need the mix dir for the library
          MIX_DIR=$(find dist-newstyle -name "vanilla" | grep "sgrt-radar-system" | grep "mix" | head -n 1)
          
          # Generate report for Safety modules
          hpc report combined.tix --srcdir=src --hpcdir=$MIX_DIR --include=Safety.Watchdog --include=Safety.Audit > coverage_report.txt
          
          cat coverage_report.txt
          
          # Parse coverage report with a python script to enforce 90% coverage
          python3 scripts/enforce_coverage.py coverage_report.txt

      - name: Generate High-Fidelity Coverage Report (HPC HTML)
        if: always()
        run: |
          MIX_DIR=$(find dist-newstyle -name "vanilla" | grep "sgrt-radar-system" | grep "mix" | head -n 1)
          if [ -f "combined.tix" ]; then
            mkdir -p hpc_html
            hpc markup combined.tix --srcdir=src --hpcdir=$MIX_DIR --destdir=hpc_html
          fi

      - name: Archive Compliance Report & HPC HTML
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: compliance-coverage-reports
          path: |
            coverage_report.txt
            hpc_html/
