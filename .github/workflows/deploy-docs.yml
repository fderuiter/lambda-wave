name: Deploy Integrated Knowledge Hub & Haddock Docs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python tools
        run: pip install pyyaml mkdocs mkdocs-material

      - name: Install system dependencies
        run: scripts/setup_env.sh --skip-security

      - name: Update package index
        run: cabal update

      - name: Check Safety Documentation
        run: ./tools/check-docs.sh

      - name: Generate Haddock Documentation
        run: cabal haddock --haddock-html --haddock-options="--odir=docs_output/"

      - name: Generate Navigation and Build MkDocs Portal
        run: |
          python3 scripts/generate_portal_nav.py
          mkdocs build -d docs_site

      - name: Merge Haddock with Portal
        run: |
          mkdir -p docs_site/haddock
          test -d docs_output || { echo "docs_output not found"; exit 1; }
          cp -r docs_output/* docs_site/haddock/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: './docs_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
