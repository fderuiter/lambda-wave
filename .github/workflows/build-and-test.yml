name: Build and Test

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: haskell:9.8
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: scripts/setup_env.sh

      - name: Update Cabal
        run: cabal update

      - name: Build dependencies
        run: cabal build --only-dependencies

      - name: Build
        run: cabal build

      - name: Build Watchdog Fault Executable
        run: cabal build watchdog-fault

      - name: Run Tests
        run: cabal test | tee test.log

      - name: Compliance Gate
        run: python3 scripts/compliance_gate.py test.log

      - name: Archive Compliance Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: compliance-report
          path: compliance_report.txt
