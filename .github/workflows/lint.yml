name: Lint

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - 'feature/*'
      - 'bugfix/*'

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HLint and Ormolu
        run: |
          cabal install hlint --ignore-project
          cabal install ormolu --ignore-project

      - name: Install Pre-commit
        run: pip install --break-system-packages pre-commit

      - name: Run Pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Install pyyaml
        run: pip install --break-system-packages pyyaml

      - name: Validate CODEOWNERS
        run: python3 ./scripts/validate_codeowners.py

      - name: Check Reference Docs Narrative
        run: ./scripts/check_reference_narrative.py

      - name: Check Architecture Docs Sync
        run: python3 ./scripts/extract_architecture.py --check
      - name: Generate Traceability Matrix
        run: python3 tools/qa/compliance_engine.py
      - name: Verify Traceability Links
        run: python3 scripts/verify_traceability_links.py

      - name: Run Duplicate Clone Detector
        run: python3 scripts/detect_clones.py --dirs src/UI src/FFI/Hud cbits/src/hud.cpp cbits/src/a11y_bridge.cpp cbits/include/hud.h cbits/include/a11y_bridge.h --threshold 5
