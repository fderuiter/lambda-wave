<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lambda-Wave Monitor</title>
    <link id="favicon" rel="icon" type="image/svg+xml" href="">
    <style>
        body { font-family: monospace; background: #111; color: #eee; margin: 0; padding: 20px; }
        #beam-status { font-size: 2em; text-align: center; padding: 20px; border-radius: 10px; margin-bottom: 20px; transition: background-color 0.3s ease, color 0.3s ease; }
        .BeamOn { background: #0f0; color: #000; }
        .BeamOff { background: #cc0000; color: #fff; }
        .BeamHold { background: #ff0; color: #000; }
        .Offline { background: #555; color: #ccc; }
        canvas { border: 1px solid #333; background: #000; display: block; margin: 0 auto; max-width: 100%; height: auto; }
        #stats { text-align: center; margin-top: 10px; }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; transition: background-color 0.3s ease, box-shadow 0.3s ease, border-radius 0.3s ease, transform 0.3s ease; }
        .dot-live { background-color: #0f0; box-shadow: 0 0 5px #0f0; border-radius: 50%; }
        .dot-offline { background-color: #f00; box-shadow: 0 0 5px #f00; border-radius: 0; }
        .dot-connecting { background-color: #ff0; animation: pulse 1s infinite; border-radius: 0; transform: rotate(45deg); }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        @media (prefers-reduced-motion: reduce) {
            .dot-connecting { animation: none; opacity: 0.8; }
        }
        abbr { transition: color 0.3s ease; }
        abbr:hover { color: #0ff; }
        abbr:focus-visible { outline: 2px solid #0ff; outline-offset: 2px; }
        .noscript-alert { background: #cc0000; color: #fff; padding: 10px; margin-bottom: 20px; border-radius: 10px; text-align: center; }
        #ts, #pt-count { display: inline-block; text-align: right; font-variant-numeric: tabular-nums; }
        #ts { width: 5ch; }
        #pt-count { width: 4ch; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    </style>
</head>
<body>
    <noscript>
        <div class="noscript-alert" role="alert">
            JavaScript is required to view the real-time radar stream.
        </div>
    </noscript>
    <main>
        <h1 class="sr-only">Lambda-Wave Real-time Monitor</h1>
        <div id="beam-status" class="Offline" role="alert" aria-live="assertive" aria-atomic="true">CONNECTING...</div>
        <canvas id="plot" width="800" height="400" role="img" aria-label="Real-time trace and point cloud visualization"></canvas>
        <div id="stats">
            <span aria-live="polite" aria-atomic="true"><span id="conn-dot" class="status-dot dot-connecting" aria-hidden="true"></span><span id="conn-text">Connecting...</span></span> <span aria-hidden="true">|</span>
            <abbr tabindex="0" title="Time elapsed for the current radar frame" style="cursor: help; text-decoration: underline dotted; text-decoration-skip-ink: none;">Frame Time</abbr><span aria-hidden="true">:</span> <span id="ts">0.0</span> ms <span aria-hidden="true">|</span> <abbr tabindex="0" title="Number of points in the current point cloud" style="cursor: help; text-decoration: underline dotted; text-decoration-skip-ink: none;">Points</abbr><span aria-hidden="true">:</span> <span id="pt-count">0</span>
        </div>
    </main>

    <script>
        const ws = new WebSocket("ws://" + location.host + "/ws");
        const statusEl = document.getElementById('beam-status');
        const tsEl = document.getElementById('ts');
        const ptCountEl = document.getElementById('pt-count');
        const canvas = document.getElementById('plot');
        const connDot = document.getElementById('conn-dot');
        const connText = document.getElementById('conn-text');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        // Trace history for plot (Y-axis: Position Z, X-axis: Time)
        const trace = [];
        const maxTrace = 300; // 10 seconds at 30Hz

        function updateFavicon(color, shape = 'circle') {
            let shapeSvg = '';
            if (shape === 'square') {
                shapeSvg = `<rect width="100" height="100" fill="${color}"/>`;
            } else if (shape === 'triangle') {
                shapeSvg = `<polygon points="50,0 100,100 0,100" fill="${color}"/>`;
            } else {
                shapeSvg = `<circle cx="50" cy="50" r="50" fill="${color}"/>`;
            }
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${shapeSvg}</svg>`;
            document.getElementById('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(svg);
        }

        function drawEmptyState(message, color, guidance) {
            canvas.setAttribute('aria-label', message + (guidance ? ': ' + guidance : ''));
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = color || '#aaa';
            ctx.font = '24px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(message, width / 2, height / 2 - 15);

            if (guidance) {
                ctx.fillStyle = '#888';
                ctx.font = '14px monospace';
                ctx.fillText(guidance, width / 2, height / 2 + 15);
            }
        }

        // Initial state
        drawEmptyState('Connecting...', '#ff0', 'Waiting for radar WebSocket stream...');
        document.title = 'Connecting... - Lambda-Wave Monitor';
        updateFavicon('#ff0', 'triangle');

        ws.onopen = () => {
            canvas.setAttribute('aria-label', 'Real-time trace and point cloud visualization');
            connDot.className = 'status-dot dot-live';
            connText.innerText = 'Live';
            document.title = 'Live - Lambda-Wave Monitor';
            updateFavicon('#0f0', 'circle');
        };

        ws.onclose = () => {
            connDot.className = 'status-dot dot-offline';
            connText.innerText = 'Disconnected';
            statusEl.innerText = 'OFFLINE';
            statusEl.className = 'Offline';
            tsEl.innerText = 'N/A';
            ptCountEl.innerText = 'N/A';
            document.title = 'Disconnected - Lambda-Wave Monitor';
            updateFavicon('#f00', 'square');
            drawEmptyState('Disconnected', '#f00', 'Check hardware connection or restart service.');
        };

        ws.onerror = () => {
            connDot.className = 'status-dot dot-offline';
            connText.innerText = 'Connection Error';
            statusEl.innerText = 'OFFLINE';
            statusEl.className = 'Offline';
            document.title = 'Error - Lambda-Wave Monitor';
            updateFavicon('#f00', 'square');
            drawEmptyState('Connection Error', '#f00', 'Check hardware connection or restart service.');
        };

        let lastTs = 0;
        let lastBeamState = null;
        let lastTextUpdate = 0;

        ws.onmessage = (event) => {
            const state = JSON.parse(event.data);
            const now = performance.now();

            // 1. Update Beam Status
            // Only update DOM if state changed to prevent aria-live screen reader spam at 30Hz
            if (state.beamState !== lastBeamState) {
                // Insert space before capital letters (e.g., "BeamOn" -> "BEAM ON")
                statusEl.innerText = state.beamState.replace(/([A-Z])/g, ' $1').trim().toUpperCase();
                statusEl.className = state.beamState;
                document.title = statusEl.innerText + ' - Lambda-Wave Monitor';

                let faviconColor = '#555';
                let faviconShape = 'circle';
                if (state.beamState === 'BeamOn') { faviconColor = '#0f0'; faviconShape = 'circle'; }
                else if (state.beamState === 'BeamOff') { faviconColor = '#f00'; faviconShape = 'square'; }
                else if (state.beamState === 'BeamHold') { faviconColor = '#ff0'; faviconShape = 'triangle'; }
                updateFavicon(faviconColor, faviconShape);

                lastBeamState = state.beamState;
            }

            // 2. Update Stats
            // Throttle text updates to ~4Hz (every 250ms) to prevent visual flickering and cognitive overload
            if (now - lastTextUpdate > 250) {
                // Calculate delta in milliseconds from raw nanoseconds
                if (lastTs > 0 && state.timestamp > lastTs) {
                    const deltaMs = (state.timestamp - lastTs) / 1000000;
                    tsEl.innerText = deltaMs.toFixed(1);
                } else if (lastTs === 0) {
                    tsEl.innerText = "0.0";
                }
                ptCountEl.innerText = state.pointCloud.length.toLocaleString();
                lastTextUpdate = now;
            }
            lastTs = state.timestamp;

            // 3. Update Trace
            // Kalman State vector x is [Pos, Vel, Accel].
            // In Types.hs we serialized stateVector as V3(x, y, z).
            // So state.respiratoryTrace.stateVector.x is Position.
            const position = state.respiratoryTrace.stateVector.x;
            trace.push(position);
            if (trace.length > maxTrace) trace.shift();

            // 4. Render
            draw(state.pointCloud, trace);
        };

        function draw(points, trace) {
            ctx.clearRect(0, 0, width, height);

            // Draw Trace (Line Graph)
            // Map position (mm) to Y pixels. Assume breathing range is e.g. -20mm to +20mm around 0.
            // Let's use fixed scale: +/- 100mm range.
            const scaleY = height / 200; // 200mm range (-100 to +100)
            const midY = height / 2;

            // Draw center reference line
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, midY);
            ctx.lineTo(width, midY);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 2;
            ctx.beginPath();

            trace.forEach((val, i) => {
                const x = (i / maxTrace) * width;
                const y = midY - (val * scaleY);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // Draw Point Cloud (Dots)
            // We visualize the Z-coordinate of points at the current time slice (right edge).
            ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
            const rightX = width - 10;
            points.forEach(p => {
                 // p.z is usually the depth/distance from sensor.
                 // p.y is usually height.
                 // Let's plot p.z relative to isocenter (which is 0 in Kalman filter usually).
                 const y = midY - (p.z * scaleY);
                 ctx.fillRect(rightX, y, 3, 3);
            });
        }
    </script>
</body>
</html>
